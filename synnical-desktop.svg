<?xml version="1.0" encoding="UTF-8"?>
<svg
  xmlns="http://www.w3.org/2000/svg"
  xmlns:xlink="http://www.w3.org/1999/xlink"
  width="100%"
  height="100%"
  viewBox="0 0 1920 1080"
>
  <defs>
    <style>
      .day-text { font-family: 'Inter', -apple-system, sans-serif; font-weight: 100; font-size: 180px; fill: rgba(0,0,0,0.8); letter-spacing: 0.3em; }
      .clock-time { font-family: 'Inter', -apple-system, sans-serif; font-weight: 100; font-size: 72px; fill: rgba(0,0,0,0.85); }
      .clock-sec { font-family: 'Inter', -apple-system, sans-serif; font-weight: 200; font-size: 32px; fill: rgba(0,0,0,0.5); }
      .clock-date { font-family: 'Inter', -apple-system, sans-serif; font-weight: 300; font-size: 14px; fill: rgba(0,0,0,0.55); }
      .widget-bg { fill: rgba(0,0,0,0.15); backdrop-filter: blur(20px); rx: 16px; }
      .widget-border { stroke: rgba(255,255,255,0.1); stroke-width: 1; fill: none; rx: 16px; }
      .dock-bg { fill: rgba(0,0,0,0.25); rx: 16px; }
      .dock-icon { cursor: pointer; transition: transform 0.2s; }
      .dock-icon:hover { transform: translateY(-8px) scale(1.1); }
    </style>
    
    <!-- Wallpaper pattern (cherry blossom samurai reference) -->
    <pattern id="wallpaper" patternUnits="userSpaceOnUse" width="1920" height="1080">
      <image xlink:href="./brand/wallpapers/sakura-samurai-1.png" x="0" y="0" width="1920" height="1080" preserveAspectRatio="xMidYMid slice"/>
    </pattern>
    
    <!-- Glass effect -->
    <filter id="glass">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#wallpaper)"/>
  <rect width="100%" height="100%" fill="rgba(0,0,0,0.08)"/>
  
  <!-- Center Day Display -->
  <text x="960" y="400" text-anchor="middle" class="day-text" id="day-display">SATURDAY</text>
  
  <!-- Clock Widget (Bottom Left) -->
  <g transform="translate(80, 850)">
    <rect class="widget-bg" x="0" y="-60" width="280" height="90"/>
    <rect class="widget-border" x="0" y="-60" width="280" height="90"/>
    <text x="140" y="0" text-anchor="middle" class="clock-time" id="clock-time">11:10</text>
    <text x="210" y="-5" class="clock-sec" id="clock-sec">03</text>
    <text x="140" y="22" text-anchor="middle" class="clock-date" id="clock-date">Saturday, January 21</text>
  </g>
  
  <!-- Date/Calendar Widgets (Right Side) -->
  <g transform="translate(1600, 750)">
    <!-- Date Card -->
    <rect class="widget-bg" x="0" y="0" width="110" height="100"/>
    <rect class="widget-border" x="0" y="0" width="110" height="100"/>
    <text x="55" y="45" text-anchor="middle" font-size="36" fill="rgba(255,255,255,0.9)" id="date-day">20</text>
    <text x="55" y="68" text-anchor="middle" font-size="11" fill="rgba(96,165,250,0.8)" id="date-month">August</text>
    <text x="55" y="85" text-anchor="middle" font-size="16" fill="rgba(255,255,255,0.7)" id="date-year">2026</text>
  </g>
  
  <!-- Notes Widget -->
  <g transform="translate(1475, 865)">
    <rect fill="#FACC15" x="0" y="0" width="225" height="28" rx="8" ry="8"/>
    <text x="12" y="18" font-size="12" font-weight="600" fill="rgba(0,0,0,0.75)">Notes</text>
    <rect class="widget-bg" x="0" y="30" width="225" height="70"/>
    <rect class="widget-border" x="0" y="30" width="225" height="70"/>
    <text x="12" y="52" font-size="11" fill="rgba(255,255,255,0.7)">Your text won't erase</text>
    <text x="12" y="66" font-size="11" fill="rgba(255,255,255,0.7)">If you switch to another app</text>
    <text x="12" y="92" font-size="9" fill="rgba(255,255,255,0.3)">6/15/2022 3:27:52 PM</text>
  </g>
  
  <!-- Dock (Bottom Center) -->
  <g transform="translate(760, 1020)">
    <rect class="dock-bg" x="0" y="-50" width="400" height="56"/>
    
    <!-- Browser Icon -->
    <g class="dock-icon" transform="translate(15, -42)">
      <defs>
        <linearGradient id="browserBgStatic" x1="10" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
          <stop stop-color="#38bdf8"/>
          <stop offset="1" stop-color="#2563eb"/>
        </linearGradient>
      </defs>
      <rect width="34" height="34" rx="8" fill="url(#browserBgStatic)"/>
      <rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/>
      <circle cx="17" cy="17" r="8.8" fill="none" stroke="white" stroke-width="1.8"/>
      <path d="M8.2 17h17.6M17 8.2c3 3.3 4.5 6.3 4.5 8.8s-1.5 5.5-4.5 8.8M17 8.2c-3 3.3-4.5 6.3-4.5 8.8s1.5 5.5 4.5 8.8" fill="none" stroke="white" stroke-width="1.4" stroke-linecap="round"/>
    </g>
    
    <!-- Games Icon -->
    <g class="dock-icon" transform="translate(58, -42)">
      <defs>
        <linearGradient id="gamesBgStatic" x1="10" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
          <stop stop-color="#a855f7"/>
          <stop offset="1" stop-color="#db2777"/>
        </linearGradient>
      </defs>
      <rect width="34" height="34" rx="8" fill="url(#gamesBgStatic)"/>
      <rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/>
      <path d="M9 18h16c2.8 0 5 2 5 4.5 0 1.9-1.3 3.4-3 3.4-1.2 0-2-.5-3-2.2h-9c-1 1.7-1.8 2.2-3 2.2-1.7 0-3-1.5-3-3.4C9 20 11.2 18 14 18Z" fill="rgba(0,0,0,.24)" stroke="white" stroke-width="1.7" stroke-linejoin="round"/>
      <path d="M12 21v3M10.5 22.5h3M22.5 22h.1M25.5 24h.1" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    
    <!-- Chat Icon -->
    <g class="dock-icon" transform="translate(101, -42)">
      <defs>
        <linearGradient id="chatBgStatic" x1="10" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
          <stop stop-color="#22c55e"/>
          <stop offset="1" stop-color="#0f766e"/>
        </linearGradient>
      </defs>
      <rect width="34" height="34" rx="8" fill="url(#chatBgStatic)"/>
      <rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/>
      <path d="M9 11h16v11H15l-4.5 3v-3H9z" fill="rgba(0,0,0,.22)" stroke="white" stroke-width="1.8" stroke-linejoin="round"/>
      <path d="M13 16h8M13 19h5" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    </g>
    
    <!-- SynnFlix Icon -->
    <g class="dock-icon" transform="translate(144, -42)">
      <defs>
        <linearGradient id="flixBgStatic" x1="10" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
          <stop stop-color="#ef4444"/>
          <stop offset="1" stop-color="#7f1d1d"/>
        </linearGradient>
      </defs>
      <rect width="34" height="34" rx="8" fill="url(#flixBgStatic)"/>
      <rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/>
      <path d="M9 11h16v13H9z" fill="rgba(0,0,0,.3)" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="M9 11l3-3h16l-3 3M13 8l-3 3M21 8l-3 3" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M15 15v5l4-2.5z" fill="white"/>
    </g>
    
    <!-- Music Icon -->
    <g class="dock-icon" transform="translate(187, -42)">
      <defs>
        <linearGradient id="musicBgStatic" x1="10" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
          <stop stop-color="#f97316"/>
          <stop offset="1" stop-color="#be123c"/>
        </linearGradient>
      </defs>
      <rect width="34" height="34" rx="8" fill="url(#musicBgStatic)"/>
      <rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/>
      <path d="M21 9v13.5a4.8 4.8 0 1 1-3-4.5V14l10-2.8V20a4.8 4.8 0 1 1-3-4.5V11z" fill="white" opacity=".96"/>
    </g>
    
    <!-- AI Assistant Icon -->
    <g class="dock-icon" transform="translate(230, -42)">
      <defs>
        <linearGradient id="aiBgStatic" x1="10" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
          <stop stop-color="#06b6d4"/>
          <stop offset="1" stop-color="#7c3aed"/>
        </linearGradient>
      </defs>
      <rect width="34" height="34" rx="8" fill="url(#aiBgStatic)"/>
      <rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/>
      <rect x="10" y="12" width="14" height="12" rx="4" fill="rgba(0,0,0,.22)" stroke="white" stroke-width="1.7"/>
      <path d="M13 10v2M21 10v2M13.8 18h.1M20.2 18h.1M15.5 22h3" stroke="white" stroke-width="1.7" stroke-linecap="round"/>
    </g>
    
    <!-- YouTube Icon -->
    <g class="dock-icon" transform="translate(273, -42)">
      <rect width="34" height="34" rx="8" fill="#ff0000"/>
      <rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/>
      <path d="M14 11.5l8 5.5-8 5.5z" fill="white"/>
    </g>
    
    <!-- GeForce NOW Icon -->
    <g class="dock-icon" transform="translate(316, -42)">
      <rect width="34" height="34" rx="8" fill="#76b900"/>
      <rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/>
      <path d="M11 16.2a5.5 5.5 0 0 1 11 0c0 3.6-3 5.8-5.5 7.8-2.5-2-5.5-4.2-5.5-7.8Z" fill="white" opacity=".95"/>
      <path d="M13.5 16.3a3.5 3.5 0 0 1 7 0c0 2.1-1.8 3.3-3.5 4.7-1.7-1.4-3.5-2.6-3.5-4.7Z" fill="#76b900"/>
    </g>
    
    <!-- Temp Mail Icon -->
    <g class="dock-icon" transform="translate(359, -42)">
      <defs>
        <linearGradient id="mailBgStatic" x1="10" y1="8" x2="56" y2="58" gradientUnits="userSpaceOnUse">
          <stop stop-color="#facc15"/>
          <stop offset="1" stop-color="#f97316"/>
        </linearGradient>
      </defs>
      <rect width="34" height="34" rx="8" fill="url(#mailBgStatic)"/>
      <rect x="1" y="1" width="32" height="32" rx="7" fill="none" stroke="rgba(255,255,255,.42)" stroke-width="1.5"/>
      <rect x="10" y="12" width="14" height="10" rx="2" fill="rgba(0,0,0,.18)" stroke="white" stroke-width="1.6"/>
      <path d="m10.5 12.5 6.5 5.5 6.5-5.5" fill="none" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Live Update Script -->
  <script><![CDATA[
    function updateClock() {
      const now = new Date();
      const days = ['SUNDAY','MONDAY','TUESDAY','WEDNESDAY','THURSDAY','FRIDAY','SATURDAY'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      
      // Update day
      const dayEl = document.getElementById('day-display');
      if (dayEl) dayEl.textContent = days[now.getDay()];
      
      // Update time
      const timeEl = document.getElementById('clock-time');
      const secEl = document.getElementById('clock-sec');
      const dateEl = document.getElementById('clock-date');
      
      if (timeEl) timeEl.textContent = String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0');
      if (secEl) secEl.textContent = String(now.getSeconds()).padStart(2,'0');
      if (dateEl) dateEl.textContent = days[now.getDay()] + ', ' + months[now.getMonth()] + ' ' + now.getDate() + ', ' + now.getFullYear();
      
      // Update date widget
      const dateDay = document.getElementById('date-day');
      const dateMonth = document.getElementById('date-month');
      const dateYear = document.getElementById('date-year');
      
      if (dateDay) dateDay.textContent = now.getDate();
      if (dateMonth) dateMonth.textContent = months[now.getMonth()];
      if (dateYear) dateYear.textContent = now.getFullYear();
    }
    
    updateClock();
    setInterval(updateClock, 1000);
  ]]></script>
</svg>
